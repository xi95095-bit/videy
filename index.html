<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Video Player UI</title>
  <style>
    body {
      margin: 0;
      background-color: #0f0f0f;
      font-family: Arial, sans-serif;
      color: white;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 15px;
      background-color: #1a1a1a;
    }

    .logo {
      font-weight: bold;
      font-size: 18px;
    }

    .upload-btn {
      background-color: #2d6cdf;
      padding: 8px 14px;
      border-radius: 8px;
      color: white;
      border: none;
      cursor: pointer;
    }

    /* Advertise */
    .ads {
      padding: 10px 15px;
      color: #aaa;
      font-size: 14px;
    }

    /* Video Container */
    .video-container {
      position: relative;
      margin: 10px;
      border-radius: 15px;
      overflow: hidden;
      background-color: black;
    }

    video {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Play button overlay */
    .play-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 70px;
      height: 70px;
      background-color: rgba(255,255,255,0.8);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    .play-btn::after {
      content: '';
      border-left: 20px solid black;
      border-top: 12px solid transparent;
      border-bottom: 12px solid transparent;
      margin-left: 5px;
    }

    /* Bottom navbar (optional) */
    .navbar {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: #1a1a1a;
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
    }

    .nav-item {
      color: white;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="logo">vldey.co</div>
    <button class="upload-btn">Upload</button>
  </div>

  <!-- Advertise -->
  <div class="ads">Advertise</div>

  <!-- Video -->
  <div class="video-container">
    <video id="video">
      <source src="vid.mp4" type="video/mp4">
    </video>

    <div class="play-btn" onclick="playVideo()"></div>
  </div>

  <!-- Bottom Navbar -->
  <div class="navbar">
    <div class="nav-item">Home</div>
    <div class="nav-item">Explore</div>
    <div class="nav-item">Saved</div>
    <div class="nav-item">Profile</div>
  </div>

  <script>
    function playVideo() {
      const video = document.getElementById("video");
      video.play();
      document.querySelector(".play-btn").style.display = "none";
    }
  </script>

</body>
</html>
